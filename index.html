<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noche para pedir un deseo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; background: #03030a; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: none; touch-action: none; }
  .hint {
    position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    font-family: "Outfit", "Segoe UI", system-ui, sans-serif; font-weight: 300; font-size: 15px; letter-spacing: 0.06em;
    color: rgba(225, 232, 255, 0.8); pointer-events: none; white-space: nowrap; transition: opacity 1.6s ease;
  }
  .hint.off { opacity: 0; }
</style>
</head>
<body>
<canvas id="c" aria-label="Paisaje nocturno con lluvia de cometas, lago, colina, árboles y un telescopio"></canvas>
<div class="hint" id="hint">Mueve el cursor y pide un deseo</div>

<script>
(() => {
  // Todo se dibuja en un espacio virtual de 1600×900 que cubre la pantalla.
  const VW = 1600, VH = 900, HZ = 550;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const hint = document.getElementById('hint');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rnd = (a, b) => a + Math.random() * (b - a);

  let dpr, s, ox, oy, k, skyC, lakeC, landC, landTop;

  const hillY = x => 605 + ((x - 860) / 790) ** 2 * 310;
  const groundY = x => 815 + Math.sin(x * 0.009) * 12 + Math.sin(x * 0.026) * 5;
  const landY = x => Math.min(hillY(x), groundY(x));

  // Sprite de brillo reutilizable
  const glowSprite = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.15, 'rgba(230,240,255,0.65)');
    gr.addColorStop(0.45, 'rgba(160,190,255,0.18)');
    gr.addColorStop(1, 'rgba(120,120,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    return c;
  })();
  const glow = (g, x, y, size, a) => { g.globalAlpha = a; g.drawImage(glowSprite, x - size / 2, y - size / 2, size, size); g.globalAlpha = 1; };

  // ---------- estrellas, nubes, brillos del lago ----------
  const stars = [];
  for (let i = 0; i < 460; i++) {
    const r = Math.random();
    stars.push({
      x: Math.random() * VW, y: Math.pow(Math.random(), 1.25) * (HZ - 25),
      r: Math.random() < 0.9 ? rnd(0.6, 1.5) : rnd(1.6, 2.4),
      c: r < 0.55 ? '255,255,255' : r < 0.85 ? '168,220,255' : '210,236,255',
      base: rnd(0.35, 0.95), ph: rnd(0, 6.28), sp: rnd(0.0008, 0.003),
      sparkle: Math.random() < 0.035
    });
  }
  const clouds = [
    { x: 100, y: 160, w: 520, h: 16, v: 0.008 },
    { x: 780, y: 95, w: 380, h: 12, v: 0.006 },
    { x: 980, y: 300, w: 620, h: 18, v: 0.011 },
    { x: 300, y: 370, w: 320, h: 11, v: 0.007 },
    { x: -200, y: 450, w: 460, h: 14, v: 0.009 },
  ];
  const shimmer = [];
  for (let i = 0; i < 160; i++) {
    const y = HZ + 6 + Math.pow(Math.random(), 1.3) * (VH - HZ);
    shimmer.push({ x: Math.random() * VW, y, len: rnd(10, 60) * (0.5 + (y - HZ) / 350), ph: rnd(0, 6.28), sp: rnd(0.001, 0.003) });
  }

  // ---------- capas estáticas ----------
  function layer() {
    const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height;
    const g = c.getContext('2d'); g.setTransform(k, 0, 0, k, ox * dpr, oy * dpr);
    return [c, g];
  }

  function buildSky() {
    const [c, g] = layer();
    const gr = g.createLinearGradient(0, 0, 0, HZ);
    gr.addColorStop(0, '#020208'); gr.addColorStop(0.55, '#07081d'); gr.addColorStop(1, '#171538');
    g.fillStyle = gr; g.fillRect(-VW, -VH, VW * 3, HZ + VH);
    g.fillStyle = '#171538'; g.fillRect(-VW, HZ, VW * 3, VH);
    const neb = (x, y, r, col) => { const n = g.createRadialGradient(x, y, 0, x, y, r); n.addColorStop(0, col); n.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = n; g.fillRect(x - r, y - r, r * 2, r * 2); };
    neb(1150, 180, 520, 'rgba(90,60,170,0.13)');
    neb(320, 130, 460, 'rgba(40,80,170,0.10)');
    neb(800, HZ, 700, 'rgba(100,70,170,0.16)');
    return c;
  }

  function buildLake() {
    const [c, g] = layer();
    const gr = g.createLinearGradient(0, HZ, 0, VH);
    gr.addColorStop(0, '#141a4a'); gr.addColorStop(0.25, '#0a1034'); gr.addColorStop(1, '#040616');
    g.fillStyle = gr; g.fillRect(-VW, HZ, VW * 3, VH);
    // reflejo suave del cielo cerca del horizonte
    const hz = g.createLinearGradient(0, HZ, 0, HZ + 60);
    hz.addColorStop(0, 'rgba(140,120,220,0.18)'); hz.addColorStop(1, 'rgba(140,120,220,0)');
    g.fillStyle = hz; g.fillRect(-VW, HZ, VW * 3, 60);
    // orilla lejana
    g.beginPath(); g.moveTo(-VW, HZ + 2);
    for (let x = -VW; x <= VW * 2; x += 10) g.lineTo(x, HZ - 8 - Math.sin(x * 0.006) * 9 - Math.sin(x * 0.021 + 1) * 4 - Math.max(0, Math.sin(x * 0.0023 + 2)) * 14);
    g.lineTo(VW * 2, HZ + 2); g.closePath();
    const sh = g.createLinearGradient(0, HZ - 40, 0, HZ);
    sh.addColorStop(0, '#15143a'); sh.addColorStop(1, '#0a0a22');
    g.fillStyle = sh; g.fill();
    return c;
  }

  function buildLand() {
    const [c, g] = layer();

    // colina y suelo
    g.beginPath(); g.moveTo(-VW, VH + 10); g.lineTo(-VW, landY(0));
    for (let x = 0; x <= VW; x += 6) g.lineTo(x, landY(x));
    g.lineTo(VW * 2, landY(VW)); g.lineTo(VW * 2, VH + 10); g.closePath();
    const hg = g.createLinearGradient(0, 600, 0, VH);
    hg.addColorStop(0, '#3f9b5b'); hg.addColorStop(0.35, '#2a7a47'); hg.addColorStop(1, '#0d3220');
    g.fillStyle = hg; g.fill();
    g.save(); g.clip();
    const top = g.createRadialGradient(860, 600, 0, 860, 600, 520);
    top.addColorStop(0, 'rgba(170,220,255,0.16)'); top.addColorStop(1, 'rgba(170,220,255,0)');
    g.fillStyle = top; g.fillRect(0, 580, VW, 400);
    // textura suave de pasto
    for (let i = 0; i < 900; i++) {
      const x = Math.random() * VW, y = landY(x) + 10 + Math.random() * (VH - landY(x));
      g.fillStyle = Math.random() < 0.5 ? 'rgba(120,200,140,0.05)' : 'rgba(0,30,15,0.08)';
      g.beginPath(); g.ellipse(x, y, rnd(8, 26), rnd(3, 7), 0, 0, 6.29); g.fill();
    }
    g.restore();
    // luz de borde
    g.beginPath();
    for (let x = 0; x <= VW; x += 6) x ? g.lineTo(x, landY(x)) : g.moveTo(x, landY(x));
    g.strokeStyle = 'rgba(170,235,195,0.45)'; g.lineWidth = 2.5; g.stroke();
    // briznas
    g.lineCap = 'round';
    for (let x = 0; x < VW; x += rnd(3, 7)) {
      const y = landY(x), h = rnd(4, 13), lean = rnd(-3, 3);
      g.strokeStyle = Math.random() < 0.5 ? 'rgba(110,200,130,0.8)' : 'rgba(70,160,100,0.8)';
      g.lineWidth = rnd(1, 1.8);
      g.beginPath(); g.moveTo(x, y + 2); g.quadraticCurveTo(x + lean * 0.3, y - h * 0.6, x + lean, y - h); g.stroke();
    }

    // riachuelo
    const pts = [];
    for (let y = 800; y <= VH + 10; y += 6) pts.push([220 + (y - 800) * 0.85 + Math.sin(y * 0.05) * 8, y, 10 + (y - 800) * 0.6]);
    g.beginPath();
    pts.forEach(([x, y, w], i) => i ? g.lineTo(x - w, y) : g.moveTo(x - w, y));
    for (let i = pts.length - 1; i >= 0; i--) g.lineTo(pts[i][0] + pts[i][2], pts[i][1]);
    g.closePath();
    const sg = g.createLinearGradient(200, 800, 330, VH);
    sg.addColorStop(0, '#1c2f72'); sg.addColorStop(1, '#2f55b4');
    g.fillStyle = sg; g.fill();
    g.strokeStyle = 'rgba(18,50,30,0.7)'; g.lineWidth = 4; g.stroke();
    g.strokeStyle = 'rgba(200,225,255,0.35)'; g.lineWidth = 1.5; g.setLineDash([14, 22]);
    for (const off of [-0.4, 0.15, 0.5]) {
      g.beginPath(); pts.forEach(([x, y, w], i) => i ? g.lineTo(x + w * off, y) : g.moveTo(x + w * off, y)); g.stroke();
    }
    g.setLineDash([]);

    // piedras moradas
    function rock(x, rx, ry) {
      const b = landY(x) + ry * 0.25, cy = b - ry * 0.6;
      g.fillStyle = 'rgba(0,10,5,0.35)';
      g.beginPath(); g.ellipse(x + 3, b + 1, rx * 1.1, ry * 0.3, 0, 0, 6.29); g.fill();
      const rg = g.createLinearGradient(x - rx, cy - ry, x + rx, cy + ry);
      rg.addColorStop(0, '#c2a8f5'); rg.addColorStop(0.45, '#7a5cc2'); rg.addColorStop(1, '#3a2870');
      g.fillStyle = rg;
      g.beginPath(); g.ellipse(x, cy, rx, ry, rnd(-0.15, 0.15), 0, 6.29); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.18)';
      g.beginPath(); g.ellipse(x - rx * 0.35, cy - ry * 0.45, rx * 0.35, ry * 0.2, -0.3, 0, 6.29); g.fill();
    }
    rock(340, 26, 16); rock(386, 15, 10); rock(485, 20, 14); rock(750, 14, 9);
    rock(1130, 30, 19); rock(1180, 16, 10); rock(1480, 26, 16); rock(1515, 12, 8);

    // cerca de madera
    const f0 = 540, f1 = 740;
    const rail = (dy, w) => {
      g.beginPath();
      for (let x = f0; x <= f1; x += 5) x === f0 ? g.moveTo(x, landY(x) - dy) : g.lineTo(x, landY(x) - dy);
      g.strokeStyle = '#4a2f1a'; g.lineWidth = w + 2; g.stroke();
      g.strokeStyle = '#8b5e3a'; g.lineWidth = w; g.stroke();
    };
    rail(22, 6); rail(44, 6);
    for (let x = f0; x <= f1; x += 50) {
      const y = landY(x), pg = g.createLinearGradient(x - 5, 0, x + 5, 0);
      pg.addColorStop(0, '#a8764c'); pg.addColorStop(1, '#5a3a20');
      g.fillStyle = pg;
      g.beginPath(); g.roundRect(x - 5, y - 60, 10, 64, [5, 5, 1, 1]); g.fill();
    }

    // telescopio
    const tb = landY(1000), mx = 1000, my = tb - 52;
    g.lineCap = 'round'; g.strokeStyle = '#4b4574'; g.lineWidth = 5;
    for (const [lx, ly] of [[972, tb + 2], [1030, tb + 2], [1005, tb + 5]]) { g.beginPath(); g.moveTo(mx, my); g.lineTo(lx, ly); g.stroke(); }
    g.fillStyle = '#6f68a0'; g.beginPath(); g.arc(mx, my, 7, 0, 6.29); g.fill();
    g.save(); g.translate(mx, my - 4); g.rotate(-0.55);
    const tg = g.createLinearGradient(0, -12, 0, 12);
    tg.addColorStop(0, '#f4f1ff'); tg.addColorStop(0.5, '#c4bee6'); tg.addColorStop(1, '#7c76a6');
    g.fillStyle = tg;
    g.beginPath(); g.moveTo(-62, -7); g.lineTo(72, -11); g.lineTo(72, 11); g.lineTo(-62, 7); g.closePath(); g.fill();
    g.fillStyle = '#ffffff'; g.beginPath(); g.roundRect(70, -13, 10, 26, 3); g.fill();
    g.fillStyle = '#3c3760'; g.beginPath(); g.roundRect(-72, -4, 12, 8, 2); g.fill();
    g.fillStyle = '#8f89b8'; g.beginPath(); g.roundRect(-5, -9, 10, 18, 2); g.fill();
    g.restore();
    lens.x = mx + Math.cos(-0.55) * 80 + Math.sin(0.55) * 4; lens.y = my - 4 + Math.sin(-0.55) * 80;

    // árboles
    function tree(tx, base, top, w, blobs) {
      const tgd = g.createLinearGradient(tx - w, 0, tx + w, 0);
      tgd.addColorStop(0, '#9a6842'); tgd.addColorStop(0.45, '#6a4428'); tgd.addColorStop(1, '#2f1c0f');
      g.fillStyle = tgd;
      g.beginPath();
      g.moveTo(tx - w * 0.7, top); g.lineTo(tx + w * 0.7, top);
      g.quadraticCurveTo(tx + w * 0.8, base - 40, tx + w * 1.9, base + 4);
      g.lineTo(tx - w * 1.9, base + 4);
      g.quadraticCurveTo(tx - w * 0.8, base - 40, tx - w * 0.7, top);
      g.fill();
      g.fillStyle = '#10361f';
      for (const [x, y, r] of blobs) { g.beginPath(); g.arc(x, y, r, 0, 6.29); g.fill(); }
      for (const [x, y, r] of blobs) {
        const lg = g.createRadialGradient(x - r * 0.35, y - r * 0.4, 0, x - r * 0.2, y - r * 0.2, r * 1.05);
        lg.addColorStop(0, '#72c97e'); lg.addColorStop(0.4, '#3d9150'); lg.addColorStop(0.8, '#1d5c32'); lg.addColorStop(1, 'rgba(16,54,31,0)');
        g.fillStyle = lg; g.beginPath(); g.arc(x, y, r, 0, 6.29); g.fill();
      }
      g.fillStyle = 'rgba(200,240,210,0.08)';
      for (let i = 0; i < 40; i++) {
        const [x, y, r] = blobs[Math.random() * blobs.length | 0];
        const a = rnd(3.4, 5.2), d = r * rnd(0.3, 0.85);
        g.beginPath(); g.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, rnd(4, 10), 0, 6.29); g.fill();
      }
    }
    const R = (cx, cy, arr) => arr.map(([x, y, r]) => [cx + x, cy + y, r]);
    tree(1310, landY(1310), 360, 16, R(1310, 350,
      [[-130, 90, 48], [130, 100, 52], [-90, 50, 78], [90, 40, 86], [0, 90, 82], [-40, -80, 72], [50, -70, 68], [0, 0, 110]]));
    tree(50, landY(50), 540, 14, R(40, 520,
      [[60, 100, 46], [-50, 50, 60], [80, 30, 62], [20, -70, 62], [0, 0, 90]]));

    return c;
  }
  const lens = { x: 0, y: 0 };

  function computeLandTop() {
    landTop = new Float32Array(VW).fill(VH);
    const d = landC.getContext('2d').getImageData(0, 0, landC.width, landC.height).data, cw = landC.width, ch = landC.height;
    for (let vx = 0; vx < VW; vx++) {
      const px = Math.round((ox + vx * s) * dpr);
      if (px < 0 || px >= cw) continue;
      for (let py = 0; py < ch; py++) if (d[(py * cw + px) * 4 + 3] > 60) { landTop[vx] = (py / dpr - oy) / s; break; }
    }
  }

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
    s = Math.max(innerWidth / VW, innerHeight / VH);
    ox = (innerWidth - VW * s) / 2; oy = (innerHeight - VH * s) / 2; k = s * dpr;
    skyC = buildSky(); lakeC = buildLake(); landC = buildLand();
    computeLandTop();
  }

  // ---------- cometas ----------
  const COLORS = ['255,255,255', '168,220,255', '205,190,255', '255,226,180'];
  const comets = [], sparks = [], ripples = [], dust = [];
  function spawnComet(big) {
    const sp = big ? rnd(9, 12) : rnd(5, 8);
    comets.push({ x: rnd(-500, VW), y: -30, vx: sp * 0.5, vy: sp, len: big ? rnd(260, 340) : rnd(110, 200),
      c: COLORS[Math.random() * COLORS.length | 0], big, ty: HZ + 15 + Math.pow(Math.random(), 0.8) * (VH - HZ - 30) });
  }
  let hero = null, heroTimer = 90;

  function drawStreak(x, y, vx, vy, len, col, width, a) {
    const m = Math.hypot(vx, vy), tx = x - vx / m * len, ty = y - vy / m * len;
    const gr = ctx.createLinearGradient(tx, ty, x, y);
    gr.addColorStop(0, `rgba(${col},0)`); gr.addColorStop(1, `rgba(${col},${a})`);
    ctx.strokeStyle = gr; ctx.lineWidth = width; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(x, y); ctx.stroke();
  }
  function burst(x, y, col, n, p) {
    for (let i = 0; i < n; i++) {
      const a = -rnd(0.15, Math.PI - 0.15), v = rnd(0.5, p);
      sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, decay: rnd(0.015, 0.035), col, r: rnd(1, 2.2) });
    }
  }

  // ---------- cursor estrella ----------
  const star = { x: VW / 2, y: VH / 2, tx: VW / 2, ty: VH / 2, a: 0, on: false, px: 0, py: 0 };
  let moved = false;
  function toV(e) { return [(e.clientX - ox) / s, (e.clientY - oy) / s]; }
  function point(e) {
    const [x, y] = toV(e);
    if (!star.on) { star.x = x; star.y = y; }
    star.tx = x; star.ty = y; star.on = true;
    if (!moved) { moved = true; hint.classList.add('off'); }
  }
  cv.addEventListener('pointermove', point);
  cv.addEventListener('pointerdown', point);
  cv.addEventListener('pointerleave', () => { star.on = false; });
  cv.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') star.on = false; });
  cv.addEventListener('pointercancel', () => { star.on = false; });

  function starShape(x, y, R, r, rot) {
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = rot + i * Math.PI / 4, rr = i % 2 ? r : R;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill();
  }

  // ---------- bucle ----------
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(3, (now - last) / 16.67); last = now;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(skyC, 0, 0);
    ctx.setTransform(k, 0, 0, k, ox * dpr, oy * dpr);

    // estrellas
    ctx.globalCompositeOperation = 'lighter';
    for (const st of stars) {
      const a = st.base * (0.55 + 0.45 * Math.sin(now * st.sp + st.ph));
      ctx.fillStyle = `rgba(${st.c},${a})`;
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 6.29); ctx.fill();
      if (st.r > 1.6) glow(ctx, st.x, st.y, st.r * 10, a * 0.35);
      if (st.sparkle) { ctx.fillStyle = `rgba(${st.c},${a * 0.8})`; starShape(st.x, st.y, st.r * 5, st.r * 0.5, 0); }
    }

    // nubes delgadas
    ctx.globalCompositeOperation = 'source-over';
    for (const c of clouds) {
      const span = VW + c.w * 2;
      const x = ((c.x + now * c.v) % span + span) % span - c.w;
      for (const [dy, col, sc] of [[4, '30,28,80', 1], [-2, '90,62,160', 0.8], [-5, '140,110,210', 0.45]]) {
        ctx.save(); ctx.translate(x + c.w / 2, c.y + dy); ctx.scale(1, c.h / (c.w / 2) * sc);
        const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, c.w / 2 * sc + 1);
        gr.addColorStop(0, `rgba(${col},0.55)`); gr.addColorStop(0.6, `rgba(${col},0.25)`); gr.addColorStop(1, `rgba(${col},0)`);
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, c.w / 2 * sc + 1, 0, 6.29); ctx.fill();
        ctx.restore();
      }
    }

    // lago
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(lakeC, 0, 0);
    ctx.setTransform(k, 0, 0, k, ox * dpr, oy * dpr);
    ctx.globalCompositeOperation = 'lighter';
    for (const st of stars) {
      if (st.y < 260) continue;
      const ry = 2 * HZ - st.y + 6;
      if (ry > VH) continue;
      const a = st.base * 0.3 * (0.5 + 0.5 * Math.sin(now * st.sp * 1.6 + st.ph));
      ctx.fillStyle = `rgba(${st.c},${a})`;
      ctx.fillRect(st.x + Math.sin(now * 0.0015 + ry * 0.2) * 2 - st.r * 1.5, ry, st.r * 3, st.r * 0.8);
    }
    ctx.lineCap = 'round';
    for (const sh of shimmer) {
      const a = 0.05 + 0.1 * Math.max(0, Math.sin(now * sh.sp + sh.ph));
      ctx.strokeStyle = `rgba(150,180,255,${a})`; ctx.lineWidth = 1.2;
      const drift = Math.sin(now * 0.0006 + sh.ph) * 6;
      ctx.beginPath(); ctx.moveTo(sh.x + drift, sh.y); ctx.lineTo(sh.x + sh.len + drift, sh.y); ctx.stroke();
    }
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i]; r.r += 0.9 * dt; r.life -= 0.02 * dt;
      if (r.life <= 0) { ripples.splice(i, 1); continue; }
      ctx.strokeStyle = `rgba(170,210,255,${r.life * 0.5})`; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r, r.r * 0.22, 0, 0, 6.29); ctx.stroke();
    }

    // cometas
    acc += dt * (reduce ? 0.03 : 0.09);
    while (acc > 1) { acc -= 1; spawnComet(Math.random() < 0.07); }
    for (let i = comets.length - 1; i >= 0; i--) {
      const m = comets[i];
      m.x += m.vx * dt; m.y += m.vy * dt;
      drawStreak(m.x, m.y, m.vx, m.vy, m.len, m.c, m.big ? 2.6 : 1.5, 0.9);
      glow(ctx, m.x, m.y, m.big ? 46 : 24, 0.9);
      const xi = Math.max(0, Math.min(VW - 1, m.x | 0)), lt = landTop[xi];
      if (m.x >= 0 && m.x < VW && m.y >= lt) { burst(m.x, lt, m.c, m.big ? 26 : 12, m.big ? 4 : 2.6); comets.splice(i, 1); }
      else if (m.y >= m.ty && m.x >= 0 && m.x < VW) {
        ripples.push({ x: m.x, y: m.y, r: 2, life: 1 });
        for (let j = 0; j < 7; j++) sparks.push({ x: m.x, y: m.y, vx: rnd(-1.5, 1.5), vy: rnd(-2.5, -0.5), life: 1, decay: 0.045, col: '168,220,255', r: 1.2 });
        comets.splice(i, 1);
      } else if (m.y > VH + 50 || m.x > VW + 300) comets.splice(i, 1);
    }

    // estrella fugaz principal, arriba a la derecha
    heroTimer -= dt;
    if (!hero && heroTimer <= 0) hero = { x: 1620, y: 20, vx: -10, vy: 4.6, life: 1 };
    if (hero) {
      hero.x += hero.vx * dt; hero.y += hero.vy * dt;
      if (hero.x < 1050) hero.life -= 0.035 * dt;
      drawStreak(hero.x, hero.y, hero.vx, hero.vy, 380, '255,255,255', 3, hero.life);
      drawStreak(hero.x, hero.y, hero.vx, hero.vy, 200, '168,220,255', 7, hero.life * 0.25);
      glow(ctx, hero.x, hero.y, 70, hero.life);
      if (hero.life <= 0) { hero = null; heroTimer = rnd(360, 600); }
    }

    // tierra encima
    ctx.globalCompositeOperation = 'source-over';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(landC, 0, 0);
    ctx.setTransform(k, 0, 0, k, ox * dpr, oy * dpr);

    ctx.globalCompositeOperation = 'lighter';
    glow(ctx, lens.x, lens.y, 26, 0.35 + 0.3 * Math.sin(now * 0.0025));

    // chispas
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.09 * dt; p.life -= p.decay * dt;
      if (p.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.fillStyle = `rgba(${p.col},${p.life})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.29); ctx.fill();
      glow(ctx, p.x, p.y, p.r * 8, p.life * 0.4);
    }

    // cursor estrella y su polvo
    star.px = star.x; star.py = star.y;
    star.x += (star.tx - star.x) * Math.min(1, 0.35 * dt);
    star.y += (star.ty - star.y) * Math.min(1, 0.35 * dt);
    star.a += ((star.on ? 1 : 0) - star.a) * Math.min(1, 0.12 * dt);
    const speed = Math.hypot(star.x - star.px, star.y - star.py);
    if (star.on && speed > 0.8) {
      const n = Math.min(4, 1 + speed / 8);
      for (let i = 0; i < n; i++) {
        const t = Math.random();
        dust.push({ x: star.px + (star.x - star.px) * t + rnd(-4, 4), y: star.py + (star.y - star.py) * t + rnd(-4, 4),
          vx: rnd(-0.3, 0.3), vy: rnd(-0.1, 0.5), life: 1, decay: rnd(0.012, 0.03), r: rnd(0.8, 2.2), col: COLORS[Math.random() * 3 | 0] });
      }
    }
    for (let i = dust.length - 1; i >= 0; i--) {
      const p = dust[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= p.decay * dt;
      if (p.life <= 0) { dust.splice(i, 1); continue; }
      ctx.fillStyle = `rgba(${p.col},${p.life})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, 6.29); ctx.fill();
      if (p.r > 1.8) { ctx.fillStyle = `rgba(${p.col},${p.life * 0.6})`; starShape(p.x, p.y, p.r * 3 * p.life, p.r * 0.4, 0); }
    }
    if (star.a > 0.01) {
      const pulse = 1 + Math.sin(now * 0.004) * 0.08 + Math.min(0.5, speed * 0.02);
      glow(ctx, star.x, star.y, 110 * pulse, 0.55 * star.a);
      glow(ctx, star.x, star.y, 36 * pulse, 0.9 * star.a);
      ctx.fillStyle = `rgba(255,255,255,${star.a})`;
      starShape(star.x, star.y, 20 * pulse, 2.6, now * 0.0006);
      ctx.fillStyle = `rgba(200,225,255,${0.8 * star.a})`;
      starShape(star.x, star.y, 10 * pulse, 2, now * 0.0006 + Math.PI / 4);
    }

    requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  resize();
  for (let i = 0; i < 5; i++) { spawnComet(false); comets[i].y = rnd(0, 300); }
  requestAnimationFrame(frame);
})();
</script>
</body>
